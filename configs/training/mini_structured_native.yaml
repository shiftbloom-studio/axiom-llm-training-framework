run_name: p6_mini_structured_native
seed: 13
input_axt_path: artifacts/axt/ml_software_mini.axt
output_dir: runs
model_config_path: configs/model/structured_native_research_tiny.yaml
arm_name: D_structured_native_no_geometry
train_split: null
validation_split: null
max_steps: 100
max_epochs: 1
global_batch_size: 8
micro_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 0.0005
weight_decay: 0.01
optimizer: adamw
scheduler: linear_warmup_decay
warmup_steps: 10
cooldown_steps: 20
clip_grad_norm: 1.0
precision: fp32
checkpoint_interval: 25
eval_interval: 25
log_interval: 5
save_optimizer_state: true
resume_from: null
text_projection_loss_weight: 0.2
geometry_loss_weight: 0.2
control_transform: null
text_mode: null
geometry_config_path: configs/geometry/geometry_learned_smoke.yaml
geometry_provider_kind: learned
overwrite: false
structured_loss_weights:
  structured_axc_out: 1.0
  relation_prediction: 1.0
  provenance_recovery: 1.0
  epistemic_proxy: 1.0
  stability_temporal: 1.0
  uncertainty_calibration: 0.5
  geometry_observables: 0.2
  geometry_regularization: 0.01
  text_projection: 0.2
curriculum_config:
  schedule_name: staged_complexity_ramp
  phase_boundaries: [0, 10, 25, 50, 75, 100]
  text_projection_weight_schedule: [1.0]
  structured_loss_weight_schedule: [1.0]
  relation_neighborhood_depth_schedule: [1, 2, 4]
  side_channel_dropout_schedule: [0.0, 0.05]
  geometry_activation_schedule: [0.0, 1.0]
  context_dropout_schedule: [0.0, 0.05]
  negative_sample_hardness_schedule: [0.0, 0.5, 1.0]
compute_budget_config:
  max_train_steps: 100
  max_records_seen: 10000
  max_wall_clock_seconds: 7200.0
  parameter_match_tolerance: 0.05
  compute_match_tolerance: 0.10
  estimate_flops: true
