repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        args: [src]
        additional_dependencies:
          - pydantic>=2.11.0
          - pydantic-settings>=2.9.0
          - pyarrow>=20.0.0
          - polars>=1.31.0
          - orjson>=3.10.18
          - PyYAML>=6.0.2
          - rich>=14.0.0
          - typer>=0.16.0
