name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create Python 3.14 environment
        run: |
          uv python install 3.14

      - name: Install package (locked)
        run: |
          uv sync --locked --all-extras

      - name: Ruff check
        run: |
          uv run --no-sync ruff check .

      - name: Ruff format
        run: |
          uv run --no-sync ruff format --check .

      - name: Mypy
        run: |
          uv run --no-sync mypy src

      - name: Pytest
        run: |
          uv run --no-sync pytest --cov=hcaps
