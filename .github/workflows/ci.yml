name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create Python 3.14 environment
        run: |
          uv python install 3.14
          uv venv --python 3.14 --seed venv

      - name: Install package
        run: |
          source venv/bin/activate
          python -m pip install -e '.[dev]'

      - name: Ruff check
        run: |
          source venv/bin/activate
          ruff check .

      - name: Ruff format
        run: |
          source venv/bin/activate
          ruff format --check .

      - name: Mypy
        run: |
          source venv/bin/activate
          mypy src

      - name: Pytest
        run: |
          source venv/bin/activate
          pytest --cov=hcaps
