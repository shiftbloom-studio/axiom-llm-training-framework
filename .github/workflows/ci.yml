name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    # Pull requests from forks never run on the self-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('{"group":"Default","labels":["self-hosted","linux","x64"]}') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create Python 3.14 environment
        run: |
          uv python install 3.14

      - name: Install package (locked)
        run: |
          uv sync --locked --all-extras

      - name: Ruff check
        run: |
          uv run --no-sync ruff check .

      - name: Ruff format
        run: |
          uv run --no-sync ruff format --check .

      - name: Mypy
        run: |
          uv run --no-sync mypy src

      - name: Pytest
        run: |
          uv run --no-sync pytest --cov=hcaps
