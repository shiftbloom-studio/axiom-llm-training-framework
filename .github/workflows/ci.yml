name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    # Runner comes from the org/repo variable CI_RUNNER (self-hosted label) and falls back to
    # GitHub-hosted. Fork PRs always use GitHub-hosted runners. Public repos use them too
    # (the self-hosted runner group serves private repos only), unless CI_RUNNER_PUBLIC is 'true'.
    runs-on: ${{ (github.event.repository.private || vars.CI_RUNNER_PUBLIC == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Create Python 3.14 environment
        run: |
          uv python install 3.14

      - name: Install package (locked)
        run: |
          uv sync --locked --all-extras

      - name: Ruff check
        run: |
          uv run --no-sync ruff check .

      - name: Ruff format
        run: |
          uv run --no-sync ruff format --check .

      - name: Mypy
        run: |
          uv run --no-sync mypy src

      - name: Pytest
        run: |
          uv run --no-sync pytest --cov=hcaps
